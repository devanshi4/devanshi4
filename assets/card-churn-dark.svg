<svg xmlns="http://www.w3.org/2000/svg" width="480" height="236" viewBox="0 0 480 236" role="img" aria-label="Customer Churn Prediction: ROC-AUC 0.82 on 7,043 customers">
  <defs>
    <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#8e9dff" stop-opacity="0"/><stop offset=".5" stop-color="#8e9dff" stop-opacity=".16"/><stop offset="1" stop-color="#8e9dff" stop-opacity="0"/></linearGradient>
    <clipPath id="res"><rect x="24" y="142" width="432" height="34" rx="8"/></clipPath>
  </defs>
  <style>
    text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
    .kind{font-size:13px;font-weight:600;fill:#8e9dff}
    .title{font-size:21px;font-weight:700;letter-spacing:-.4px;fill:#f0f6fc}
    .desc{font-size:14.5px;fill:#9198a1}
    .res{font-size:14.5px;font-weight:600;fill:#f0f6fc}
    .reslbl{font-size:12px;font-weight:600;fill:#8e9dff}
    .chip{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#9198a1}
    .pill{font-size:12px;font-weight:600}
    .sweep{animation:sweep 5s ease-in-out infinite}
    .pulse{animation:pulse 1.6s ease-in-out infinite}
    @keyframes sweep{0%,55%{transform:translateX(-200px)}100%{transform:translateX(480px)}}
    @keyframes pulse{50%{opacity:.25}}
    @media (prefers-reduced-motion: reduce){.sweep,.pulse{animation:none}.sweep{opacity:0}}
  </style>
  <rect x=".75" y=".75" width="478.5" height="234.5" rx="14" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/>
  <text x="24" y="36" class="kind">Machine learning</text>
  <text x="24" y="74" class="title">Customer Churn Prediction</text>
  <text class="desc"><tspan x="24" y="104">XGBoost flags telecom customers likely to cancel; SHAP</tspan><tspan x="24" y="125">explains each prediction for the retention team.</tspan></text>
  <rect x="24" y="142" width="432" height="34" rx="8" fill="#1b2040"/>
  <g clip-path="url(#res)"><rect class="sweep" x="0" y="142" width="200" height="34" fill="url(#sheen)"/></g>
  <text x="38" y="164" class="reslbl">Result</text><text x="92" y="164" class="res">ROC-AUC 0.82 on 7,043 customers</text>
  <rect x="24.0" y="190" width="66.8" height="24" rx="6" fill="#151b23" stroke="#3d444d"/><text x="32.0" y="206" class="chip">XGBoost</text><rect x="96.8" y="190" width="45.0" height="24" rx="6" fill="#151b23" stroke="#3d444d"/><text x="104.8" y="206" class="chip">SHAP</text><rect x="147.8" y="190" width="59.5" height="24" rx="6" fill="#151b23" stroke="#3d444d"/><text x="155.8" y="206" class="chip">pandas</text><rect x="213.2" y="190" width="81.2" height="24" rx="6" fill="#151b23" stroke="#3d444d"/><text x="221.2" y="206" class="chip">Streamlit</text>
</svg>
