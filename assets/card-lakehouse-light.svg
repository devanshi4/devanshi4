<svg xmlns="http://www.w3.org/2000/svg" width="480" height="236" viewBox="0 0 480 236" role="img" aria-label="E-commerce Lakehouse: 5 gold tables, queryable in Athena">
  <defs>
    <linearGradient id="sheen" x1="0" x2="1"><stop offset="0" stop-color="#3347e0" stop-opacity="0"/><stop offset=".5" stop-color="#3347e0" stop-opacity=".16"/><stop offset="1" stop-color="#3347e0" stop-opacity="0"/></linearGradient>
    <clipPath id="res"><rect x="24" y="142" width="432" height="34" rx="8"/></clipPath>
  </defs>
  <style>
    text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
    .kind{font-size:13px;font-weight:600;fill:#3347e0}
    .title{font-size:21px;font-weight:700;letter-spacing:-.4px;fill:#0c0d12}
    .desc{font-size:14.5px;fill:#59636e}
    .res{font-size:14.5px;font-weight:600;fill:#0c0d12}
    .reslbl{font-size:12px;font-weight:600;fill:#3347e0}
    .chip{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;font-size:12px;fill:#59636e}
    .pill{font-size:12px;font-weight:600}
    .sweep{animation:sweep 5s ease-in-out infinite}
    .pulse{animation:pulse 1.6s ease-in-out infinite}
    @keyframes sweep{0%,55%{transform:translateX(-200px)}100%{transform:translateX(480px)}}
    @keyframes pulse{50%{opacity:.25}}
    @media (prefers-reduced-motion: reduce){.sweep,.pulse{animation:none}.sweep{opacity:0}}
  </style>
  <rect x=".75" y=".75" width="478.5" height="234.5" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/>
  <text x="24" y="36" class="kind">Lakehouse on AWS</text>
  <text x="24" y="74" class="title">E-commerce Lakehouse</text>
  <text class="desc"><tspan x="24" y="104">Kinesis clickstream and daily batch orders move</tspan><tspan x="24" y="125">through bronze, silver and gold PySpark layers on S3.</tspan></text>
  <rect x="24" y="142" width="432" height="34" rx="8" fill="#eef0fd"/>
  <g clip-path="url(#res)"><rect class="sweep" x="0" y="142" width="200" height="34" fill="url(#sheen)"/></g>
  <text x="38" y="164" class="reslbl">Result</text><text x="92" y="164" class="res">5 gold tables, queryable in Athena</text>
  <rect x="24.0" y="190" width="66.8" height="24" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><text x="32.0" y="206" class="chip">Kinesis</text><rect x="96.8" y="190" width="59.5" height="24" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><text x="104.8" y="206" class="chip">Lambda</text><rect x="162.2" y="190" width="66.8" height="24" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><text x="170.2" y="206" class="chip">PySpark</text><rect x="235.0" y="190" width="45.0" height="24" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><text x="243.0" y="206" class="chip">Glue</text><rect x="286.0" y="190" width="59.5" height="24" rx="6" fill="#f6f8fa" stroke="#d1d9e0"/><text x="294.0" y="206" class="chip">Athena</text>
</svg>
